<section>
    <header id="drag-handle">
      <span class="brand-label">
        <img class="brand-icon" src="__COUCH_LOGO_URL__" alt="couch" draggable="false">
        <span>couch</span>
        <span class="brand-version">v__COUCH_VERSION__</span>
      </span>
      <button id="view-toggle-btn" class="view-toggle-btn" type="button" title="Expand Couch" aria-label="Expand Couch"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g transform="rotate(180 12 12)"><path d="M12 19V5m-7 7 7-7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g></svg></button>
    </header>

    <!-- LOBBY VIEW -->
    <div id="lobby">
      <!-- UPDATED: Username section without a separate button -->
      <form id="create-room-form" class="flex-column">
        <input type="text" id="username-input" placeholder="Username" autocomplete="off"/>
        <button type="submit" hidden></button>
        <button type="button" id="create-room-btn" class="btn">Create New Room</button>
      </form>

      <hr width="100%" border="1" class="muted">

      <form id="join-room-form" class="flex">
        <input type="text" id="join-room-input" placeholder="Room Code" autocomplete="off"/>
        <button type="submit" id="join-room-btn" class="btn">Join</button>
      </form>
      <div id="join-error" style="text-align: center; font-size: 10px; height: 10px;"></div>
      <div id="room-loading" role="status" aria-live="polite" aria-atomic="true">
        <span class="room-loading-spinner" aria-hidden="true"></span>
        <span id="room-loading-message">Connecting...</span>
      </div>
    </div>

    <!-- CHAT VIEW -->
    <div id="chat-container">
      <div class="room-header" style="display: flex; justify-content: flex-start; align-items: center; gap: 8px; padding: 8px; font-size: inherit;">
        <button id="display-room-id" class="btn small" type="button" title="Copy room code" aria-label="Copy room code">...</button>
        <button id="share-room-btn" class="btn small secondary icon-button" type="button" title="Copy room invite link" aria-label="Copy room invite link"><img src="__COUCH_LINK_URL__" alt="" aria-hidden="true"></button>
        <button id="show-remote-qr-btn" class="btn small secondary icon-button" type="button" title="Show remote QR code" aria-label="Show remote QR code" disabled><img src="__COUCH_QR_URL__" alt="" aria-hidden="true"></button>
        <button id="room-users-toggle" class="btn small secondary icon-button" type="button" title="Users (0)" aria-label="Users (0)" aria-expanded="false" aria-controls="room-users-panel"><img src="__COUCH_USERS_URL__" alt="" aria-hidden="true"><span id="room-users-count">(0)</span></button>
        <button id="clear-chat-btn" class="btn small secondary icon-button" type="button" title="Clear chat history on this device" aria-label="Clear chat history on this device"><img src="__COUCH_ERASER_URL__" alt="" aria-hidden="true"></button>
        <button id="leave-room-btn" class="btn small tertiary icon-button" type="button" title="Exit room" aria-label="Exit room"><img src="__COUCH_LOGOUT_URL__" alt="" aria-hidden="true"></button>
        <div id="room-users-panel" class="room-users-panel" hidden>
          <ul id="room-users-list" aria-label="Users in this room"></ul>
        </div>
      </div>
      <main><ul id="messages"></ul></main>
      <footer>
        <!-- Toolbar containing Emojis and Timestamp Button -->
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 3.2px 8px;">
          <div id="emoji-bar">
            <button class="emoji-btn" title="Clap">👏</button>
            <button class="emoji-btn" title="Laugh">😂</button>
            <button class="emoji-btn" title="Heart">♥️</button>
            <button class="emoji-btn" title="Scared">😱</button>
            <button class="emoji-btn" title="Surprise">😲</button>
            <button class="emoji-btn" title="Sad">😢</button>
            <button class="emoji-btn" title="Goodbye">👋</button>
            <button class="emoji-btn" title="Splash">💦</button>
            <button class="emoji-btn" title="Paper">🧻</button>
            <button class="emoji-btn" title="Thumbs Up">👍</button>
            <button class="emoji-btn" title="Fire">🔥</button>
            <button class="emoji-btn" title="Happy">😄</button>
            <button class="emoji-btn" title="Cool">😎</button>
            <button class="emoji-btn" title="Party">🥳</button>
            <button class="emoji-btn" title="Perfect">💯</button>
            <button class="emoji-btn" title="Sparkles">✨</button>
            <button class="emoji-btn" title="Handshake">🤝</button>
            <button class="emoji-btn" title="Synced">🔗</button>
          </div>

          <!-- NEW: Timestamp Button -->
          <button id="timestamp-btn" class="emoji-btn" title="Share current video timestamp">⏱️</button>
        </div>


        <div style="padding: 0 8px 8px 8px;">
          <form id="chat-form" style="display: flex;">
            <input type="text" id="chat-input" placeholder="Type..." autocomplete="off" required />
          </form>
        </div>
      </footer>
      <div
        id="chat-resize-handle"
        role="separator"
        aria-orientation="horizontal"
        aria-label="Resize chat history"
        aria-valuemin="70"
        aria-valuenow="130"
        tabindex="0"
      ></div>
    </div>

    <div id="compact-view" title="Open Couch">
      <div id="compact-messages"></div>
    </div>
    <dialog id="remote-qr-dialog" aria-labelledby="remote-qr-title">
      <div class="remote-qr-content">
        <h2 id="remote-qr-title">Join this room on Couch Remote</h2>
        <canvas id="remote-qr-canvas" aria-label="QR code for Couch Remote"></canvas>
        <p id="remote-qr-status" role="status" aria-live="polite"></p>
        <button id="remote-qr-close" class="btn small secondary" type="button">Close</button>
      </div>
    </dialog>
  </section>
  <button id="edge-tab" type="button" title="Show Couch" aria-label="Show Couch"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g transform="rotate(270 12 12)"><path d="M12 19V5m-7 7 7-7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g></svg></button>
