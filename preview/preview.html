<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Couch Shadow DOM Preview</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: #111827;
      color: #e5e7eb;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px;
      box-sizing: border-box;
    }

    .preview-shell {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #9ca3af; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 24px 0;
    }

    button {
      border: 1px solid #4b5563;
      border-radius: 6px;
      padding: 8px 12px;
      color: #f9fafb;
      background: #374151;
      cursor: pointer;
    }

    button:hover { background: #4b5563; }

    .fake-player {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 360px;
      border: 1px solid #374151;
      border-radius: 8px;
      background: #030712;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 360px;
      object-fit: cover;
      background: #030712;
    }

    .player-label {
      position: absolute;
      padding: 8px 12px;
      border-radius: 6px;
      background: rgb(0 0 0 / 65%);
      pointer-events: none;
    }

    #status {
      margin-top: 16px;
      color: #93c5fd;
      font-family: ui-monospace, monospace;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="preview-shell">
    <h1>Couch Shadow DOM Preview</h1>
    <p>Use the controls to reveal the real extension UI and simulate room events.</p>

    <div class="controls">
      <button id="simulate-message">Simulate message</button>
      <button id="simulate-remote-seek">Simulate remote seek</button>
      <button id="simulate-remote-play">Simulate remote play</button>
      <button id="simulate-remote-pause">Simulate remote pause</button>
    </div>

    <section class="fake-player">
      <video controls></video>
      <span class="player-label">Fake video player</span>
    </section>
    <div id="status">Loading preview...</div>
  </main>
  <script src="/preview/preview.js"></script>
</body>
</html>
